<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WC26 Predictor — FIFA World Cup 2026</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0b1220; --mut:#5b6577; --line:#e4e8f0;
  --acc:#1255cc; --acc2:#0ea36f; --warn:#d97706; --live:#dc2626; --chip:#eef2f9;
  --bar:#ffffffee; --shadow:0 1px 3px rgba(10,20,40,.08);
}
.dark{
  --bg:#0b1220; --card:#141d2f; --ink:#e8edf6; --mut:#93a0b4; --line:#243046;
  --acc:#5b8def; --acc2:#2dd497; --warn:#f59e0b; --live:#f87171; --chip:#1c2740;
  --bar:#101828ee; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
header h1{font-size:1.05rem;display:flex;align-items:center;gap:8px}
header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc2);display:inline-block}
header .sub{font-size:.72rem;color:var(--mut);margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem;cursor:pointer}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.filterbar{display:flex;gap:8px;padding:8px 14px 0;max-width:680px;margin:0 auto}
.filterbar select{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:.8rem;appearance:none}
.filterbar select.active{border-color:var(--acc);color:var(--acc);font-weight:700}
.filterbar .iconbtn{flex:0 0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:0 12px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.datehead{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.match{padding:10px 12px;cursor:pointer}
.match+.match{border-top:1px solid var(--line)}
.mtop{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut);margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:8px}
.team{flex:1;display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;min-width:0}
.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.right{justify-content:flex-end;text-align:right}
.flag{font-size:1.25rem;line-height:1}
.score{flex:0 0 auto;min-width:64px;text-align:center;font-weight:800;font-size:1.05rem}
.score .tm{display:block;font-size:.65rem;font-weight:600;color:var(--mut)}
.score.live{color:var(--live)}
.pbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--line)}
.pbar i{display:block;height:100%}
.pbar .h{background:var(--acc)} .pbar .d{background:#9aa4b8} .pbar .a{background:var(--acc2)}
.plabels{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut);margin-top:3px}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mut)}
.badge.live{background:var(--live);color:#fff;animation:pulse 1.4s infinite}
.badge.ft{background:var(--chip)}
.badge.pick{background:var(--warn);color:#fff}
.badge.proj{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
.match.proj{border-left:3px dashed var(--warn);background:color-mix(in srgb,var(--warn) 4%,transparent)}
.match.proj .team .nm{opacity:.8;font-style:italic}
.match.proj .score{color:var(--warn)}
@keyframes pulse{50%{opacity:.55}}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:7px 8px;text-align:center;border-top:1px solid var(--line)}
th{font-size:.66rem;color:var(--mut);text-transform:uppercase;border-top:none}
td.tn{text-align:left;font-weight:600;white-space:nowrap}
tr.q1 td:first-child{box-shadow:inset 3px 0 0 var(--acc2)}
tr.q3 td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.grouphead{padding:10px 12px;font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bar);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;color:var(--mut);font-size:.62rem;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:1.25rem;line-height:1}
.tabbar button.on{color:var(--acc);font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1rem;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font-size:.88rem;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:none;background:var(--card);color:var(--ink);padding:9px 4px;font-size:.8rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.stat{background:var(--chip);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.05rem}
.stat span{font-size:.62rem;color:var(--mut);text-transform:uppercase}
input[type=text],input[type=password],input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
input[type=range]{width:100%}
.note{font-size:.74rem;color:var(--mut);line-height:1.45;margin:6px 0}
.bracketwrap{overflow-x:auto;padding:4px 0 12px}
.bracket{display:flex;gap:10px;min-width:900px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bcol h4{font-size:.66rem;color:var(--mut);text-align:center;text-transform:uppercase}
.bm{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.74rem;overflow:hidden}
.bm .bt{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;cursor:pointer;gap:4px}
.bm .bt+.bt{border-top:1px solid var(--line)}
.bm .bt.w{font-weight:800;background:color-mix(in srgb,var(--acc2) 14%,transparent)}
.bm .bt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .meta{font-size:.58rem;color:var(--mut);padding:2px 8px 4px;border-top:1px dashed var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.scorein{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}
.scorein .stp{display:flex;align-items:center;gap:8px}
.scorein button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1.1rem;cursor:pointer}
.scorein b{font-size:1.3rem;min-width:22px;text-align:center}
.leader{display:flex;gap:10px;margin:10px 0}
.lcard{flex:1;background:var(--chip);border-radius:12px;padding:12px;text-align:center}
.lcard b{font-size:1.5rem;display:block}
.lcard span{font-size:.68rem;color:var(--mut)}
.empty{text-align:center;color:var(--mut);font-size:.85rem;padding:30px 10px}
.simbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.simbar i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.8rem;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
.src{font-size:.66rem;color:var(--mut);text-align:center;padding:8px 0 16px}
.matchcenter{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mc-sub{font-size:.7rem;color:var(--mut)}
.mc-loading,.mc-empty{font-size:.76rem;color:var(--mut);line-height:1.5;padding:10px 0}
.goal-list{display:grid;gap:8px;margin-top:10px}
.goal-item{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px}
.goal-min{min-width:48px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:6px 8px;text-align:center;font-weight:800;font-size:.8rem}
.goal-body{flex:1;min-width:0}
.goal-top{display:flex;align-items:center;gap:10px}
.goal-ava{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.goal-ava img{width:100%;height:100%;object-fit:cover}
.goal-ava.jersey img{object-fit:contain;padding:4px}
.goal-body b{display:block;font-size:.88rem}
.goal-body div{font-size:.72rem;color:var(--mut);line-height:1.35}
.goal-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.goal-flags span{font-size:.62rem;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.duelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.duel{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.duel b{display:block;font-size:.96rem}
.duel span{display:block;font-size:.62rem;color:var(--mut);text-transform:uppercase;margin-top:3px}
.lineup-shell{margin-top:14px}
.lineup-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
.lineup-tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.74rem;font-weight:700;cursor:pointer}
.lineup-tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lineup-meta{font-size:.72rem;color:var(--mut);margin-bottom:8px}
.pitch{background:
  radial-gradient(circle at center, rgba(255,255,255,.12) 0, rgba(255,255,255,.12) 13%, transparent 13.4%) center/100% 100% no-repeat,
  linear-gradient(180deg, color-mix(in srgb,var(--acc2) 18%, transparent), transparent 25%, transparent 75%, color-mix(in srgb,var(--acc) 14%, transparent)),
  linear-gradient(90deg, transparent 49.5%, rgba(255,255,255,.18) 49.5%, rgba(255,255,255,.18) 50.5%, transparent 50.5%),
  linear-gradient(180deg, #0f6f48, #0b5d3a);
  border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;gap:8px}
.pitch-row{display:flex;justify-content:center;gap:8px;flex-wrap:nowrap}
.pc{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(7,20,16,.34);color:#fff;border-radius:12px;padding:6px 4px;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.pc.on{border-color:#fff;transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.22)}
.pcimg{width:40px;height:40px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.pcimg img{width:100%;height:100%;object-fit:cover}
.pcimg.jersey img{object-fit:contain;padding:4px}
.pcnum{font-size:.62rem;font-weight:800;opacity:.9}
.pcnm{font-size:.64rem;font-weight:700;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcpos{font-size:.54rem;letter-spacing:.04em;opacity:.78}
.pcbadges{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.pcbadge{font-size:.52rem;font-weight:700;padding:2px 4px;border-radius:999px;background:rgba(255,255,255,.15)}
.benchlist{display:grid;gap:8px}
.benchitem{appearance:none;width:100%;display:flex;align-items:center;gap:10px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);text-align:left;cursor:pointer}
.benchitem.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.benchimg{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.benchimg img{width:100%;height:100%;object-fit:cover}
.benchimg.jersey img{object-fit:contain;padding:4px}
.benchmeta{flex:1;min-width:0}
.benchmeta b{display:block;font-size:.84rem;line-height:1.2}
.benchmeta div{font-size:.68rem;color:var(--mut)}
.focuscard{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.focusmedia{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.focusmedia img{width:100%;height:100%;object-fit:cover}
.focusmedia.jersey img{object-fit:contain;padding:5px}
.focusmeta{flex:1;min-width:0}
.focusmeta b{display:block;font-size:.9rem;line-height:1.2}
.focussub{font-size:.72rem;color:var(--mut);margin-top:3px}
.focusstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.focusstats span{font-size:.62rem;font-weight:700;padding:4px 7px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.mclink{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;color:var(--acc);text-decoration:none}
.rankbar{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.rankbar::-webkit-scrollbar{display:none}
.rankchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:700;cursor:pointer}
.rankchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.playercell{display:flex;align-items:center;gap:8px;text-align:left}
.playerpic{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--chip);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:.68rem;font-weight:800}
.playerpic img{width:100%;height:100%;object-fit:cover}
.playerpic.jersey img{object-fit:contain;padding:4px}
.playermeta{min-width:0}
.playermeta b{display:block;font-size:.78rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playermeta span{display:block;font-size:.62rem;color:var(--mut);margin-top:2px}
@media (max-width:520px){
  .pitch-row{gap:6px}
  .pc{width:62px;padding:6px 3px}
  .pcimg{width:34px;height:34px}
  .pcnm{font-size:.58rem}
  .pcpos{font-size:.5rem}
  .goal-min{min-width:42px}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1><span class="dot" id="livedot"></span>WC26 Predictor</h1>
      <div class="sub" id="lastupd">FIFA World Cup 2026 · Jun 11 – Jul 19</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="refreshbtn" title="Refresh scores">⟳</button>
      <button class="iconbtn" id="darkbtn" title="Theme">◐</button>
    </div>
  </div>
</header>

<div id="view-matches">
  <div class="filterbar">
    <select id="fteam"><option value="">⚽ All teams</option></select>
    <select id="fstage"><option value="">🏁 All stages</option><option value="G">Group stage</option><option value="R32">Round of 32</option><option value="R16">Round of 16</option><option value="QF">Quarter-finals</option><option value="SF">Semi-finals</option><option value="F">Final & 3rd place</option></select>
    <select id="fvenue"><option value="">📍 All venues</option></select>
    <button class="iconbtn" id="fclear" title="Clear filters" style="display:none">✕</button>
  </div>
  <div class="chips" id="daychips"></div>
  <main id="matchlist"></main>
</div>
<div id="view-groups" style="display:none">
  <div class="chips" id="grpmode">
    <div class="chip on" data-m="actual">Actual table</div>
    <div class="chip" data-m="proj">AI projected</div>
  </div>
  <main id="grouplist"></main>
</div>
<div id="view-bracket" style="display:none">
  <main>
    <div class="note" style="margin:12px 4px 6px">Tap any team in a knockout tie to pick your winner (orange = your pick). Real results override everything. ◆ = AI prediction.</div>
    <div style="margin:0 4px 10px;display:flex;gap:8px">
      <button class="btn sm sec" id="clearbracket">Reset my picks</button>
    </div>
    <div class="bracketwrap"><div class="bracket" id="bracket"></div></div>
  </main>
</div>
<div id="view-stats" style="display:none">
  <main id="statsmain"></main>
</div>
<div id="view-game" style="display:none">
  <main id="gamemain"></main>
</div>
<div id="view-more" style="display:none">
  <main id="moremain"></main>
</div>

<nav class="tabbar">
  <button data-v="matches" class="on"><span class="ic">⚽</span>Matches</button>
  <button data-v="groups"><span class="ic">▤</span>Groups</button>
  <button data-v="bracket"><span class="ic">🏆</span>Bracket</button>
  <button data-v="stats"><span class="ic">📊</span>Sim</button>
  <button data-v="game"><span class="ic">🎯</span>My Game</button>
  <button data-v="more"><span class="ic">⋯</span>More</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

// Dynamic ratings: base Elo, updated by every finished result (K=40, margin multiplier), plus user news adjustment.
function liveRatings(extraResults){
  const R = {}; for(const t in TEAMS) R[t] = TEAMS[t].r;
  const done = [];
  for(const fx of GFX){ const r = (extraResults||state.results)[fx[0]]; if(r && r.status==="FT") done.push({d:fx[1],h:fx[3],a:fx[4],hs:r.hs,as:r.as,v:fx[2]}); }
  for(const fx of KFX){ const r = (extraResults||state.results)[fx[0]]; if(r && r.status==="FT" && r.h && r.a) done.push({d:fx[1],h:r.h,a:r.a,hs:r.hs,as:r.as,v:fx[2]}); }
  done.sort((x,y)=> x.d<y.d?-1:1);
  for(const m of done){
    if(!(m.h in R) || !(m.a in R)) continue;
    const dh = hostEdge(m.h,m.v), da = hostEdge(m.a,m.v);
    const we = 1/(1+Math.pow(10,-((R[m.h]+dh)-(R[m.a]+da))/400));
    const s = m.hs>m.as?1:m.hs===m.as?0.5:0;
    const gd = Math.abs(m.hs-m.as);
    const G = gd<=1?1: gd===2?1.5:(11+gd)/8;
    const delta = 40*G*(s-we);
    R[m.h]+=delta; R[m.a]-=delta;
  }
  return R;
}
function hostEdge(team, venue){
  const cc = VENUE_CC[venue] || "US";
  return (TEAMS[team] && TEAMS[team].host === cc) ? 45 : 0;
}
function effRating(R, team, venue){
  return R[team] + hostEdge(team,venue) + (state.news[team]||0);
}
// Recent form bonus: +12 per win, -12 per loss over a team's completed tournament matches (max ±36)
function formAdj(team){
  let f = 0;
  const all = [...GFX.map(x=>({n:x[0],h:x[3],a:x[4]})), ...KFX.map(x=>({n:x[0]}))];
  for(const m of all){
    const r = state.results[m.n]; if(!r || r.status!=="FT") continue;
    const h = r.h||m.h, a = r.a||m.a;
    if(h===team) f += r.hs>r.as?12:r.hs<r.as?-12:0;
    else if(a===team) f += r.as>r.hs?12:r.as<r.hs?-12:0;
  }
  return Math.max(-36,Math.min(36,f));
}
function matchProbs(R, h, a, venue, knockout){
  const rh = effRating(R,h,venue)+formAdj(h), ra = effRating(R,a,venue)+formAdj(a);
  const we = 1/(1+Math.pow(10,-(rh-ra)/400));
  let pD = knockout?0:Math.max(0.10, 0.29 - Math.abs(we-0.5)*0.38);
  const pH = we*(1-pD), pA = (1-we)*(1-pD);
  // Poisson expected goals
  const total = 2.55, share = 0.32 + 0.36*we + 0.32*Math.pow(we,2)*(we>0.5?0.2:0); // smooth split
  const xh = Math.max(0.25, total*(0.25+0.75*we)), xa = Math.max(0.25, total*(0.25+0.75*(1-we)));
  // most likely scoreline
  let best=[1,1],bp=0;
  for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){
    let p = pois(xh,i)*pois(xa,j);
    if(!knockout){ if((i>j&&pH<pA)||(i<j&&pH>pA)){} }
    if(p>bp){bp=p;best=[i,j];}
  }
  if(knockout && best[0]===best[1]) best = we>=0.5?[best[0]+1,best[1]]:[best[0],best[1]+1];
  return {pH,pD,pA,we,xh,xa,hs:best[0],as:best[1]};

function pois(l,k){ let f=1; for(let i=2;i<=k;i++)f*=i; return Math.exp(-l)*Math.pow(l,k)/f; }

function groupMatches(g){ return GFX.filter(x=>x[5]===g); }
function standings(g, projected, R, resultsOverride){
  R = R || liveRatings();

  const tbl = {};
  for(const t in TEAMS) if(TEAMS[t].g===g) tbl[t]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  for(const fx of groupMatches(g)){

    else if(projected){ const p = matchProbs(R,fx[3],fx[4],fx[2],false); if(p.pD>=p.pH&&p.pD>=p.pA){hs=1;as=1;} else {hs=p.hs;as=p.as; if(hs===as){ if(p.pH>p.pA)hs++; else as++; }} }
    else continue;
    const H=tbl[fx[3]],A=tbl[fx[4]];
    H.p++;A.p++; H.gf+=hs;H.ga+=as; A.gf+=as;A.ga+=hs;
    if(hs>as){H.w++;A.l++;H.pts+=3;} else if(hs<as){A.w++;H.l++;A.pts+=3;} else {H.d++;A.d++;H.pts++;A.pts++;}
  }
  return Object.values(tbl).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || TEAMS[y.t].r-TEAMS[x.t].r);

const TSLOTS = {74:"ABCDF",77:"CDFGH",79:"CEFHI",80:"EHIJK",81:"BEFIJ",82:"AEHIJ",85:"EFGIJ",87:"DEIJL"};
function allocateThirds(qualThirds){ // qualThirds: {group:team} for the 8 best thirds
  const slots = Object.keys(TSLOTS).map(Number);
  const groups = Object.keys(qualThirds);
  const assign = {};
  function bt(i, used){
    if(i===slots.length) return true;
    const s = slots[i];
    for(const g of TSLOTS[s]){
      if(qualThirds[g] && !used.has(g)){ used.add(g); assign[s]=qualThirds[g]; if(bt(i+1,used)) return true; used.delete(g); }
    }
    return false;
  }
  // order slots by fewest available options for robustness
  slots.sort((a,b)=>{ const ca=[...TSLOTS[a]].filter(g=>qualThirds[g]).length, cb=[...TSLOTS[b]].filter(g=>qualThirds[g]).length; return ca-cb; });

}

function resolveSlots(R, projected, resultsOverride){

  const qual = {}; thirds.slice(0,8).forEach(x=> qual[x.g]=x.row.t);
  const tAssign = (thirds.length>=8) ? allocateThirds(qual) : {};
  for(const k of KFX){
    const [no,,,hS,aS] = k;

      if(slot.startsWith("M")||slot.startsWith("L")){

        const proj = out[src]; if(!proj || !proj[0] || !proj[1]) return null;

      }

function simulate(n){

      const p = matchProbs(baseR,fx[3],fx[4],fx[2],false);
      const u = Math.random();
      let hs,as;
      if(u<p.pH){ hs=1+samplePlus(p.xh); as=Math.max(0,hs-1-Math.floor(Math.random()*2)); }
      else if(u<p.pH+p.pD){ hs=as=Math.random()<0.45?1:Math.random()<0.5?0:2; }
      else { as=1+samplePlus(p.xa); hs=Math.max(0,as-1-Math.floor(Math.random()*2)); }
      res[fx[0]]={hs,as,status:"FT"};
    }
    const slots = resolveSlotsSim(baseR,res);
    // knockout
    const reach = {};
    for(const k of KFX){
      const [no,,v] = k;
      let h=slots[no][0], a=slots[no][1];
      if(!h||!a) continue;
      if(no<=88){ tally[h].r32++; tally[a].r32++; }
      let w;
      const r = res[no];
      if(r && r.status==="FT" && r.h && r.a){ w = r.hs>r.as?r.h:r.hs<r.as?r.a:(r.pw|| (Math.random()<0.5?r.h:r.a)); }
      else { const p = matchProbs(baseR,h,a,v,true); w = Math.random()<koWinProb(p)?h:a; }
      const l = w===h?a:h;
      // feed into next slots
      for(const k2 of KFX){ if(k2[3]==="M"+no) slots[k2[0]][0]=w; if(k2[4]==="M"+no) slots[k2[0]][1]=w; if(k2[3]==="L"+no) slots[k2[0]][0]=l; if(k2[4]==="L"+no) slots[k2[0]][1]=l; }
      if(no>=89&&no<=96){ tally[w].qf=tally[w].qf; tally[h].r16++; tally[a].r16++; }
      if(no>=97&&no<=100){ tally[h].qf++; tally[a].qf++; }
      if(no===101||no===102){ tally[h].sf++; tally[a].sf++; }
      if(no===104){ tally[h].fin++; tally[a].fin++; tally[w].champ++; }
    }
  }
  for(const t in tally) for(const k in tally[t]) tally[t][k] = tally[t][k]/n*100;
  return tally;
}
function samplePlus(x){ const u=Math.random(); return u<0.55?0:u<0.85?1:2; }
function resolveSlotsSim(R,res){
  const st={}; for(const g of "ABCDEFGHIJKL") st[g]=standings(g,false,R,res);
  const thirds="ABCDEFGHIJKL".split("").map(g=>({g,row:st[g][2]}));
  thirds.sort((x,y)=> y.row.pts-x.row.pts || (y.row.gf-y.row.ga)-(x.row.gf-x.row.ga) || y.row.gf-x.row.gf || Math.random()-0.5);
  const qual={}; thirds.slice(0,8).forEach(x=>qual[x.g]=x.row.t);
  const tA = allocateThirds(qual);
  const out={};
  for(const k of KFX){
    const [no,,,hS,aS]=k;
    const get = s => s.startsWith("W1")?st[s[2]][0].t : s.startsWith("R2")?st[s[2]][1].t : s.startsWith("T:")?(tA[no]||null) : null;
    out[no]=[get(hS),get(aS)];
  }
  return out;
}

function statKey(name){

function rankStat(stats, names){
  if(!stats) return 0;
  const byKey = {};
  for(const k in stats) byKey[statKey(k)] = stats[k];
  for(const name of names){

function playerRankKey(player, side){

function getRankPlayer(map, player, side){
  const key = playerRankKey(player, side);
  if(!map[key]){
    map[key] = {
      key,
      id: player.id || "",
      name: player.name || "Unknown player",
      short: player.short || player.name || "Unknown player",
      team: side.abbr || side.name || "",
      teamName: side.name || "",

      role: playerRole(player.position),
      image: player.image || side.logo || "",
      imageMode: player.imageMode || (player.image ? "cover" : "contain"),
      link: player.link || "",
      apps:0, starts:0, statGoals:0, eventGoals:0, statAssists:0, eventAssists:0,
      shots:0, onTarget:0, saves:0, tackles:0, interceptions:0, clearances:0, blocks:0,
      fouls:0, yellow:0, red:0, goalsAgainst:0
    };
  }
  const row = map[key];
  if(player.image && !row.image) row.image = player.image;
  if(player.link && !row.link) row.link = player.link;
  return row;
}
function aggregatePlayerRankings(summaries){
  const map = {};
  for(const data of summaries){
    for(const sideKey of ["home","away"]){
      const side = data.lineups && data.lineups[sideKey];
      if(!side) continue;
      for(const player of side.players || []){
        const row = getRankPlayer(map, player, side);
        row.apps++;
        if(player.starter) row.starts++;
        addPlayerTotals(row, player.stats || {});
      }
    }
    for(const goal of data.goals || []){
      const scorer = Object.values(map).find(row => (goal.id && row.id===goal.id) || (statKey(row.name)===statKey(goal.player) && (!goal.teamAbbr || row.team===goal.teamAbbr)));
      if(scorer){
        if(goal.ownGoal) scorer.ownGoals = (scorer.ownGoals||0) + 1;
        else scorer.eventGoals++;
      }
      if(goal.assist){
        const assister = Object.values(map).find(row => statKey(row.name)===statKey(goal.assist));
        if(assister) assister.eventAssists++;
      }
    }
  }
  return Object.values(map).map(row=>{
    row.goals = Math.max(row.statGoals, row.eventGoals);
    row.assists = Math.max(row.statAssists, row.eventAssists);
    row.attack = row.goals*8 + row.assists*5 + row.onTarget*1.4 + row.shots*.35;
    row.defense = row.tackles*1.4 + row.interceptions*1.8 + row.clearances*1.1 + row.blocks*1.6;
    row.keeping = row.saves*2 - row.goalsAgainst*.4;
    row.cards = row.yellow + row.red*2;
    row.overall = row.attack + row.defense + row.keeping + row.starts*.25 + row.apps*.1 - row.cards*.8 - row.fouls*.08;
    return row;
  });
}
function rankedPlayers(category){

  if(cat==="defenders") rows = rows.filter(p=>p.role==="defender" || p.defense>0);
  if(cat==="goalies") rows = rows.filter(p=>p.role==="goalie" || p.saves>0);
  const metric = p => cat==="goals" ? p.goals :
    cat==="assists" ? p.assists :
    cat==="attackers" ? p.attack :
    cat==="defenders" ? p.defense :
    cat==="goalies" ? p.saves :
    cat==="discipline" ? p.cards :
    p.overall;
  return rows.map(p=>({...p, metric:metric(p)})).filter(p=>p.metric>0 || cat==="overall").sort((a,b)=>b.metric-a.metric || b.goals-a.goals || b.assists-a.assists);
}

function formationRows(side){
  const starters = (side.players||[]).filter(player => player.starter);
  if(!starters.length) return [];
  const sorted = [...starters].sort((a,b)=>
    (a.formationPlace||99)-(b.formationPlace||99) ||
    ((+a.jersey||99)-(+b.jersey||99)) ||
    a.name.localeCompare(b.name)
  );
  const keeper = sorted.find(player => player.position==="G") || sorted[0];
  const outfield = sorted.filter(player => player!==keeper);
  let groups = (side.formation||"").split("-").map(n=>+n).filter(Boolean);
  if(groups.reduce((sum,n)=>sum+n,0)!==outfield.length){
    const first = Math.ceil(outfield.length/3);
    const second = Math.ceil((outfield.length-first)/2);
    const third = Math.max(0, outfield.length-first-second);
    groups = [first,second,third].filter(Boolean);
  }
  const rows = [];
  let idx = 0;
  for(const size of groups){
    rows.push(outfield.slice(idx, idx+size));
    idx += size;
  }
  if(idx<outfield.length) rows.push(outfield.slice(idx));
  rows.reverse();
  if(keeper) rows.push([keeper]);
  return rows.filter(row => row.length);
}

async function hydrateMatchCenter(no, m){
  const root = $("#matchcenter");
  if(!root) return;
  if(!m || !m.h || !m.a || m.projected){
    root.innerHTML = renderMatchCenterPlaceholder("Lineups and scorer details unlock once the matchup is confirmed on the live feed.");
    return;
  }
  const cached = matchCenterCache[no];
  const liveish = ["LIVE","LIVE?"].includes(matchStatus(m).s);
  const stale = !!(cached && liveish && Date.now()-cached.fetchedAt>60000);
  if(cached){
    root.innerHTML = renderMatchCenter(no, m, cached);
    bindMatchCenter(no, m);
    if(!stale) return;
  } else {
    root.innerHTML = renderMatchCenterPlaceholder("Loading live match center...");
  }
  if(!matchCenterPending[no]){
    matchCenterPending[no] = loadMatchCenter(no, m).then(data => {
      if(data) data.fetchedAt = Date.now();
      return data;
    }).finally(()=>{ delete matchCenterPending[no]; });
  }
  const data = await matchCenterPending[no];
  if(activeSheetMatch!==no || !$("#matchcenter")) return;
  if(!data){
    if(!matchCenterCache[no]) $("#matchcenter").innerHTML = renderMatchCenterPlaceholder("Live match center is unavailable right now. Try again after refreshing scores.");
    return;
  }
  matchCenterCache[no] = data;
  $("#matchcenter").innerHTML = renderMatchCenter(no, m, data);
  bindMatchCenter(no, m);
}

const canon = n => { if(!n) return null; n=n.trim(); if(TEAMS[n]) return n; if(ALIASES[n]) return ALIASES[n]; for(const t in TEAMS) if(t.toLowerCase()===n.toLowerCase()) return t; return null; };
function findMatchNo(h,a,dateISO){
  for(const fx of GFX) if((fx[3]===h&&fx[4]===a)||(fx[3]===a&&fx[4]===h)) return {no:fx[0], flip:fx[3]!==h};
  for(const k of KFX){
    const r = state.results[k[0]];
    if(r && r.h && r.a && ((r.h===h&&r.a===a)||(r.h===a&&r.a===h))) return {no:k[0], flip:r.h!==h};
    if(dateISO && Math.abs(new Date(k[1])-new Date(dateISO))<3*36e5 && !(r&&r.h)){ /* KO not yet known here — only date-match if unique below */ }
  }
  if(dateISO){
    const cands = KFX.filter(k=>Math.abs(new Date(k[1])-new Date(dateISO))<90*60000 && !(state.results[k[0]]&&state.results[k[0]].h));
    if(cands.length===1) return {no:cands[0][0], flip:false, setTeams:true};
  }
  return null;
}
function mergeResult(no, nv, src){
  const ex = state.results[no];
  // manual FT entries only yield to an online FT; manual LIVE yields to any online data
  if(ex && ex.manual){
    if(ex.status==="FT" && nv.status!=="FT") return false;
  }
  // don't downgrade FT to LIVE
  if(ex && ex.status==="FT" && !ex.manual && nv.status==="LIVE") return false;
  if(!ex || ex.hs!==nv.hs || ex.as!==nv.as || ex.status!==nv.status || ex.min!==nv.min || (nv.h&&ex.h!==nv.h)){
    state.results[no] = {...ex, ...nv, manual:false};
    return true;
  }
  return false;
}
/* ESPN public scoreboard — no key, live minute-by-minute */
async function fetchESPN(){
  let updated = 0;
  const days = [new Date(Date.now()-864e5), new Date()].map(d=>d.toISOString().slice(0,10).replace(/-/g,""));
  for(const d of [...new Set(days)]){
    const data = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates="+d);
    if(!data || !data.events) continue;
    for(const ev of data.events){
      const comp = (ev.competitions||[])[0]; if(!comp) continue;
      const home = comp.competitors.find(c=>c.homeAway==="home"), away = comp.competitors.find(c=>c.homeAway==="away");
      if(!home||!away) continue;
      const h = canon(home.team.displayName)||canon(home.team.shortDisplayName), a = canon(away.team.displayName)||canon(away.team.shortDisplayName);
      if(!h||!a) continue;
      const hit = findMatchNo(h,a,ev.date); if(!hit) continue;
      state.eventMap[hit.no] = ev.id;
      const st = ev.status&&ev.status.type?ev.status.type.state:"pre";
      const hs0 = +home.score||0, as0 = +away.score||0;
      const hs = hit.flip?as0:hs0, as = hit.flip?hs0:as0;
      const teams = hit.no>72 ? {h:hit.flip?a:h, a:hit.flip?h:a} : {};
      if(st==="in"){
        const min = (ev.status.displayClock||"").replace(/[^0-9+]/g,"");
        if(mergeResult(hit.no,{hs,as,status:"LIVE",min,...teams},"espn")) updated++;
      } else if(st==="post"){
        let pw;
        if(hs===as){ const w = comp.competitors.find(c=>c.winner); if(w){ const wn = canon(w.team.displayName); if(wn) pw = wn; } }
        if(mergeResult(hit.no,{hs,as,status:"FT",pw,...teams},"espn")) updated++;
      } else if(hit.no>72 && teams.h){
        if(mergeResult(hit.no,{status:"SCHED",...teams},"espn")) updated++;
      }
    }
  }
  return updated;
}

function statNum(stats, name){

function normalizeRosterPlayer(player, teamLogo){

  return {

    short: athlete.shortName || athlete.displayName || "Unknown player",
    jersey: player.jersey || "",

function normalizeRosterSide(side){

    name: side.team && side.team.displayName ? side.team.displayName : "",
    abbr: side.team && side.team.abbreviation ? side.team.abbreviation : "",

async function resolveEspnEventId(no, m){
  if(state.eventMap[no]) return state.eventMap[no];
  if(!m || !m.h || !m.a || m.projected) return null;
  const data = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates="+espnDateKey(m.d));
  if(!data || !data.events) return null;

    const home = comp.competitors.find(c=>c.homeAway==="home"), away = comp.competitors.find(c=>c.homeAway==="away");
    if(!home||!away) continue;
    const h = canon(home.team.displayName)||canon(home.team.shortDisplayName), a = canon(away.team.displayName)||canon(away.team.shortDisplayName);

async function loadMatchCenter(no, m){
  const eventId = await resolveEspnEventId(no, m);

  if(!summary) return null;

  }

  const comp = ((((summary.header||{}).competitions)||[])[0]) || {};
  const details = (comp.details || []).filter(item => item.scoringPlay);
  const stats = {};
  for(const side of ((summary.boxscore||{}).teams||[])){
    stats[side.homeAway] = {
      name: side.team && side.team.displayName ? side.team.displayName : "",
      abbr: side.team && side.team.abbreviation ? side.team.abbreviation : "",
      color: side.team && side.team.color ? side.team.color : "",

  }
  return {
    eventId,
    updatedAt: (summary.meta||{}).lastUpdatedAt || "",
    link: "https://www.espn.com/soccer/match/_/gameId/"+eventId,
    goals: details.map(detail => normalizeGoalEvent(detail, athleteIndex)),
    lineups,

}
const NEG_WORDS = ["injur","ruled out","out of","doubt","suspend","ban","sidelin","blow","miss the","misses","strain","hamstring","fracture","surgery","illness","crisis","fitness concern","unavailable","withdraw"];
const POS_WORDS = ["returns","return to","fit again","boost","cleared","back in training","recovered","available again","full squad","passed fit","in form","unbeaten"];
async function scanNews(team){
  const xml = await fetchText("https://news.google.com/rss/search?q="+encodeURIComponent('"'+team+'" World Cup (injury OR squad OR lineup OR team news)')+"&hl=en-US&gl=US&ceid=US:en");
  if(!xml) return null;
  let doc; try{ doc = new DOMParser().parseFromString(xml,"text/xml"); }catch(e){ return null; }
  const items = [...doc.querySelectorAll("item")].slice(0,8).map(it=>({
    title: (it.querySelector("title")||{}).textContent||"",
    link: (it.querySelector("link")||{}).textContent||"",
    date: (it.querySelector("pubDate")||{}).textContent||""
  })).filter(x=>x.title);
  let score = 0;
  for(const it of items){
    const t = it.title.toLowerCase();
    for(const w of NEG_WORDS) if(t.includes(w)){ score -= 8; it.bad = true; break; }
    for(const w of POS_WORDS) if(t.includes(w) && !it.bad){ score += 6; it.good = true; break; }
  }
  return {items, suggestion: Math.max(-60, Math.min(40, score))};
}

  // Source 1: fixturedownload feed (full schedule, confirmed results, knockout team names)
  const feed = await fetchJSON("https://fixturedownload.com/feed/json/fifa-world-cup-2026");
  if(Array.isArray(feed)){
    for(const it of feed){
      const no = it.MatchNumber;
      const h = canon(it.HomeTeam), a = canon(it.AwayTeam);
      if(it.HomeTeamScore!=null && it.AwayTeamScore!=null){
        if(mergeResult(no,{hs:it.HomeTeamScore, as:it.AwayTeamScore, status:"FT", h:h||undefined, a:a||undefined},"feed")) updated++;
      } else if(no>72 && h && a){
        const ex = state.results[no]||{};
        if(ex.h!==h || ex.a!==a){ state.results[no]={...ex, h, a, status:ex.status||"SCHED"}; updated++; }
      }
    }
  }
  // Source 2: ESPN public scoreboard (no key — live minute-by-minute, today & yesterday)
  updated += await fetchESPN();
  // Source 3: football-data.org (optional key — live scores + penalty winners)
  if(state.fdKey){
    const fd = await fetchJSON("https://api.football-data.org/v4/competitions/WC/matches",{headers:{"X-Auth-Token":state.fdKey}});
    if(fd && fd.matches){
      for(const mm of fd.matches){
        const h = canon(mm.homeTeam && (mm.homeTeam.name||mm.homeTeam.shortName));
        const a = canon(mm.awayTeam && (mm.awayTeam.name||mm.awayTeam.shortName));
        if(!h||!a) continue;
        // find our match number by teams+date
        const all=[...GFX.map(x=>({no:x[0],d:x[1],h:x[3],a:x[4]})),...KFX.map(x=>({no:x[0],d:x[1]}))];
        const cand = all.find(x=> (x.h===h&&x.a===a) || (x.h===a&&x.a===h) || (x.no>72 && Math.abs(new Date(x.d)-new Date(mm.utcDate))<36e5 && state.results[x.no] && ((state.results[x.no].h===h&&state.results[x.no].a===a)||(state.results[x.no].h===a&&state.results[x.no].a===h))));
        if(!cand) continue;
        const sc = mm.score||{}; const ft = sc.fullTime||{};
        const flip = !(GFX.find(g=>g[0]===cand.no && g[3]===h)) && cand.no<=72;
        if(mm.status==="IN_PLAY"||mm.status==="PAUSED"){
          if(mergeResult(cand.no,{hs:flip?ft.away??0:ft.home??0, as:flip?ft.home??0:ft.away??0, status:"LIVE", min:mm.minute, h:cand.no>72?h:undefined, a:cand.no>72?a:undefined},"fd")) updated++;
        } else if(mm.status==="FINISHED" && ft.home!=null){
          const pw = sc.penalties && sc.penalties.home!=null ? (sc.penalties.home>sc.penalties.away?h:a) : undefined;
          if(mergeResult(cand.no,{hs:flip?ft.away:ft.home, as:flip?ft.home:ft.away, status:"FT", pw, h:cand.no>72?h:undefined, a:cand.no>72?a:undefined},"fd")) updated++;
        }
      }
    } else if(manual){ toast("football-data.org unreachable from browser — feed still active"); }
  }
  state.lastFetch = Date.now(); save();
  if(updated){ simCache=null; toast(updated+" match update"+(updated>1?"s":"")+" ⚡"); }
  else if(manual) toast("Up to date ✓");
  $("#refreshbtn").textContent = "⟳";
  $("#lastupd").textContent = "Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" · Jun 11 – Jul 19";
  renderAll();
}
function anyLiveWindow(){
  const now = Date.now();
  return [...GFX,...KFX].some(fx => { const t=new Date(fx[1]).getTime(); return now>t-10*60000 && now<t+140*60000; });
}
/* ================= APP ================= */
function applyTheme(){ document.documentElement.classList.toggle("dark",!!state.dark); document.body.classList.toggle("dark",!!state.dark); }
function renderAll(){
  if(curView==="matches") renderMatches();
  if(curView==="groups") renderGroups();
  if(curView==="bracket") renderBracket();
  if(curView==="stats") renderStats();
  if(curView==="game") renderGame();
  if(curView==="more") renderMore();
  $("#livedot").style.background = anyLiveWindow() ? "var(--live)" : "var(--acc2)";
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2200); }
document.querySelectorAll(".tabbar button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("on",x===b));
    curView = b.dataset.v;
    for(const v of ["matches","groups","bracket","stats","game","more"]) $("#view-"+v).style.display = v===curView?"":"none";
    renderAll(); window.scrollTo(0,0);
  };
});
$("#grpmode").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  $("#grpmode").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  grpProj = c.dataset.m==="proj"; renderGroups();
});
$("#clearbracket").onclick=()=>{ state.bracket={}; save(); renderBracket(); toast("Bracket reset to AI picks"); };
/* filter dropdowns */
(function(){
  const ft = $("#fteam"), fv = $("#fvenue");
  Object.keys(TEAMS).sort().forEach(t=>{ const o=document.createElement("option"); o.value=t; o.textContent=`${TEAMS[t].f} ${t} (Grp ${TEAMS[t].g})`; ft.appendChild(o); });
  const venues = [...new Set([...GFX.map(x=>x[2]),...KFX.map(x=>x[2])])].sort();
  venues.forEach(v=>{ const o=document.createElement("option"); o.value=v; const cc=VENUE_CC[v]==="MX"?"🇲🇽":VENUE_CC[v]==="CA"?"🇨🇦":"🇺🇸"; o.textContent=`${cc} ${v.replace(" Stadium","")}`; fv.appendChild(o); });
  const fs = $("#fstage");
  ft.onchange = ()=>{ filtTeam = ft.value; renderMatches(); };
  fv.onchange = ()=>{ filtVenue = fv.value; renderMatches(); };
  fs.onchange = ()=>{ filtStage = fs.value; renderMatches(); };
  $("#fclear").onclick = ()=>{ filtTeam=filtVenue=filtStage=""; ft.value=fv.value=fs.value=""; renderMatches(); };
})();
$("#darkbtn").onclick=()=>{ state.dark=!state.dark; save(); applyTheme(); };
$("#refreshbtn").onclick=()=>refreshScores(true);
applyTheme();
renderAll();
refreshScores(false);
setInterval(()=>{ refreshScores(false); }, anyLiveWindow()? 90000 : 300000);
</script>
