<title>WC26 Predictor — FIFA World Cup 2026</title>
<style>
:root{

  --bar:#ffffffee; --shadow:0 1px 3px rgba(10,20,40,.08);
}
.dark{
  --bg:#0b1220; --card:#141d2f; --ink:#e8edf6; --mut:#93a0b4; --line:#243046;
  --acc:#5b8def; --acc2:#2dd497; --warn:#f59e0b; --live:#f87171; --chip:#1c2740;
  --bar:#101828ee; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
header h1{font-size:1.05rem;display:flex;align-items:center;gap:8px}
header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc2);display:inline-block}
header .sub{font-size:.72rem;color:var(--mut);margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem;cursor:pointer}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:0 12px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.datehead{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.match{padding:10px 12px;cursor:pointer}
.match+.match{border-top:1px solid var(--line)}
.mtop{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut);margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:8px}
.team{flex:1;display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;min-width:0}
.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.right{justify-content:flex-end;text-align:right}
.flag{font-size:1.25rem;line-height:1}
.score{flex:0 0 auto;min-width:64px;text-align:center;font-weight:800;font-size:1.05rem}
.score .tm{display:block;font-size:.65rem;font-weight:600;color:var(--mut)}
.score.live{color:var(--live)}
.pbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--line)}
.pbar i{display:block;height:100%}
.pbar .h{background:var(--acc)} .pbar .d{background:#9aa4b8} .pbar .a{background:var(--acc2)}
.plabels{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut);margin-top:3px}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mut)}
.badge.live{background:var(--live);color:#fff;animation:pulse 1.4s infinite}
.badge.ft{background:var(--chip)}
.badge.pick{background:var(--warn);color:#fff}
@keyframes pulse{50%{opacity:.55}}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:7px 8px;text-align:center;border-top:1px solid var(--line)}
th{font-size:.66rem;color:var(--mut);text-transform:uppercase;border-top:none}
td.tn{text-align:left;font-weight:600;white-space:nowrap}
tr.q1 td:first-child{box-shadow:inset 3px 0 0 var(--acc2)}
tr.q3 td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.grouphead{padding:10px 12px;font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bar);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;color:var(--mut);font-size:.62rem;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:1.25rem;line-height:1}
.tabbar button.on{color:var(--acc);font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1rem;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font-size:.88rem;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:none;background:var(--card);color:var(--ink);padding:9px 4px;font-size:.8rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.stat{background:var(--chip);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.05rem}
.stat span{font-size:.62rem;color:var(--mut);text-transform:uppercase}
input[type=text],input[type=password],input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
input[type=range]{width:100%}
.note{font-size:.74rem;color:var(--mut);line-height:1.45;margin:6px 0}
.bracketwrap{overflow-x:auto;padding:4px 0 12px}
.bracket{display:flex;gap:10px;min-width:900px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bcol h4{font-size:.66rem;color:var(--mut);text-align:center;text-transform:uppercase}
.bm{background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.74rem;overflow:hidden}
.bm .bt{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;cursor:pointer;gap:4px}
.bm .bt+.bt{border-top:1px solid var(--line)}
.bm .bt.w{font-weight:800;background:color-mix(in srgb,var(--acc2) 14%,transparent)}
.bm .bt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .meta{font-size:.58rem;color:var(--mut);padding:2px 8px 4px;border-top:1px dashed var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.scorein{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}
.scorein .stp{display:flex;align-items:center;gap:8px}
.scorein button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1.1rem;cursor:pointer}
.scorein b{font-size:1.3rem;min-width:22px;text-align:center}
.leader{display:flex;gap:10px;margin:10px 0}
.lcard{flex:1;background:var(--chip);border-radius:12px;padding:12px;text-align:center}
.lcard b{font-size:1.5rem;display:block}
.lcard span{font-size:.68rem;color:var(--mut)}
.empty{text-align:center;color:var(--mut);font-size:.85rem;padding:30px 10px}
.simbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.simbar i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.8rem;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
.src{font-size:.66rem;color:var(--mut);text-align:center;padding:8px 0 16px}
</style>
</head>

// Dynamic ratings: base Elo, updated by every finished result (K=40, margin multiplier), plus user news adjustment.
function liveRatings(extraResults){
  const R = {}; for(const t in TEAMS) R[t] = TEAMS[t].r;
  const done = [];
  for(const fx of GFX){ const r = (extraResults||state.results)[fx[0]]; if(r && r.status==="FT") done.push({d:fx[1],h:fx[3],a:fx[4],hs:r.hs,as:r.as,v:fx[2]}); }
  for(const fx of KFX){ const r = (extraResults||state.results)[fx[0]]; if(r && r.status==="FT" && r.h && r.a) done.push({d:fx[1],h:r.h,a:r.a,hs:r.hs,as:r.as,v:fx[2]}); }
  done.sort((x,y)=> x.d<y.d?-1:1);
  for(const m of done){
    if(!(m.h in R) || !(m.a in R)) continue;
    const dh = hostEdge(m.h,m.v), da = hostEdge(m.a,m.v);
    const we = 1/(1+Math.pow(10,-((R[m.h]+dh)-(R[m.a]+da))/400));
    const s = m.hs>m.as?1:m.hs===m.as?0.5:0;
    const gd = Math.abs(m.hs-m.as);
    const G = gd<=1?1: gd===2?1.5:(11+gd)/8;
    const delta = 40*G*(s-we);
    R[m.h]+=delta; R[m.a]-=delta;
  }

}
function hostEdge(team, venue){
  const cc = VENUE_CC[venue] || "US";

}
function effRating(R, team, venue){
  return R[team] + hostEdge(team,venue) + (state.news[team]||0);
}
// Recent form bonus: +12 per win, -12 per loss over a team's completed tournament matches (max ±36)
function formAdj(team){
  let f = 0;
  const all = [...GFX.map(x=>({n:x[0],h:x[3],a:x[4]})), ...KFX.map(x=>({n:x[0]}))];
  for(const m of all){
    const r = state.results[m.n]; if(!r || r.status!=="FT") continue;
    const h = r.h||m.h, a = r.a||m.a;
    if(h===team) f += r.hs>r.as?12:r.hs<r.as?-12:0;
    else if(a===team) f += r.as>r.hs?12:r.as<r.hs?-12:0;
  }
  return Math.max(-36,Math.min(36,f));
}
function matchProbs(R, h, a, venue, knockout){
  const rh = effRating(R,h,venue)+formAdj(h), ra = effRating(R,a,venue)+formAdj(a);
  const we = 1/(1+Math.pow(10,-(rh-ra)/400));
  let pD = knockout?0:Math.max(0.10, 0.29 - Math.abs(we-0.5)*0.38);
  const pH = we*(1-pD), pA = (1-we)*(1-pD);
  // Poisson expected goals
  const total = 2.55, share = 0.32 + 0.36*we + 0.32*Math.pow(we,2)*(we>0.5?0.2:0); // smooth split
  const xh = Math.max(0.25, total*(0.25+0.75*we)), xa = Math.max(0.25, total*(0.25+0.75*(1-we)));
  // most likely scoreline
  let best=[1,1],bp=0;
  for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){
    let p = pois(xh,i)*pois(xa,j);
    if(!knockout){ if((i>j&&pH<pA)||(i<j&&pH>pA)){} }
    if(p>bp){bp=p;best=[i,j];}
  }
  if(knockout && best[0]===best[1]) best = we>=0.5?[best[0]+1,best[1]]:[best[0],best[1]+1];
  return {pH,pD,pA,we,xh,xa,hs:best[0],as:best[1]};
}
function pois(l,k){ let f=1; for(let i=2;i<=k;i++)f*=i; return Math.exp(-l)*Math.pow(l,k)/f; }

function groupMatches(g){ return GFX.filter(x=>x[5]===g); }
function standings(g, projected, R, resultsOverride){
  R = R || liveRatings();
  const res = resultsOverride || state.results;
  const tbl = {};
  for(const t in TEAMS) if(TEAMS[t].g===g) tbl[t]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  for(const fx of groupMatches(g)){
    let r = res[fx[0]];
    let hs,as;
    if(r && r.status==="FT"){ hs=r.hs; as=r.as; }
    else if(projected){ const p = matchProbs(R,fx[3],fx[4],fx[2],false); if(p.pD>=p.pH&&p.pD>=p.pA){hs=1;as=1;} else {hs=p.hs;as=p.as; if(hs===as){ if(p.pH>p.pA)hs++; else as++; }} }
    else continue;
    const H=tbl[fx[3]],A=tbl[fx[4]];
    H.p++;A.p++; H.gf+=hs;H.ga+=as; A.gf+=as;A.ga+=hs;
    if(hs>as){H.w++;A.l++;H.pts+=3;} else if(hs<as){A.w++;H.l++;A.pts+=3;} else {H.d++;A.d++;H.pts++;A.pts++;}
  }
  return Object.values(tbl).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || TEAMS[y.t].r-TEAMS[x.t].r);

/* ---- Third-place allocation (backtracking over slot constraints) ---- */
const TSLOTS = {74:"ABCDF",77:"CDFGH",79:"CEFHI",80:"EHIJK",81:"BEFIJ",82:"AEHIJ",85:"EFGIJ",87:"DEIJL"};
function allocateThirds(qualThirds){ // qualThirds: {group:team} for the 8 best thirds
  const slots = Object.keys(TSLOTS).map(Number);
  const groups = Object.keys(qualThirds);
  const assign = {};
  function bt(i, used){
    if(i===slots.length) return true;
    const s = slots[i];
    for(const g of TSLOTS[s]){
      if(qualThirds[g] && !used.has(g)){ used.add(g); assign[s]=qualThirds[g]; if(bt(i+1,used)) return true; used.delete(g); }
    }
    return false;
  }
  // order slots by fewest available options for robustness
  slots.sort((a,b)=>{ const ca=[...TSLOTS[a]].filter(g=>qualThirds[g]).length, cb=[...TSLOTS[b]].filter(g=>qualThirds[g]).length; return ca-cb; });
  bt(0,new Set());

}

function resolveSlots(R, projected, resultsOverride){
  const res = resultsOverride || state.results;

  thirds.sort((x,y)=> y.row.pts-x.row.pts || (y.row.gf-y.row.ga)-(x.row.gf-x.row.ga) || y.row.gf-x.row.gf || TEAMS[y.row.t].r-TEAMS[x.row.t].r);
  const qual = {}; thirds.slice(0,8).forEach(x=> qual[x.g]=x.row.t);
  const tAssign = (thirds.length>=8) ? allocateThirds(qual) : {};
  for(const k of KFX){

/* ---- Monte Carlo tournament simulation ---- */
function simulate(n){
  const tally = {}; for(const t in TEAMS) tally[t]={r32:0,r16:0,qf:0,sf:0,fin:0,champ:0};
  const baseR = liveRatings();
  for(let it=0; it<n; it++){
    const res = {};
    // copy actual finished
    for(const k in state.results) res[k]=state.results[k];
    // group stage sample
    for(const fx of GFX){
      if(res[fx[0]] && res[fx[0]].status==="FT") continue;
      const p = matchProbs(baseR,fx[3],fx[4],fx[2],false);
      const u = Math.random();
      let hs,as;
      if(u<p.pH){ hs=1+samplePlus(p.xh); as=Math.max(0,hs-1-Math.floor(Math.random()*2)); }
      else if(u<p.pH+p.pD){ hs=as=Math.random()<0.45?1:Math.random()<0.5?0:2; }
      else { as=1+samplePlus(p.xa); hs=Math.max(0,as-1-Math.floor(Math.random()*2)); }
      res[fx[0]]={hs,as,status:"FT"};
    }
    const slots = resolveSlotsSim(baseR,res);
    // knockout
    const reach = {};
    for(const k of KFX){
      const [no,,v] = k;
      let h=slots[no][0], a=slots[no][1];
      if(!h||!a) continue;
      if(no<=88){ tally[h].r32++; tally[a].r32++; }
      let w;
      const r = res[no];
      if(r && r.status==="FT" && r.h && r.a){ w = r.hs>r.as?r.h:r.hs<r.as?r.a:(r.pw|| (Math.random()<0.5?r.h:r.a)); }
      else { const p = matchProbs(baseR,h,a,v,true); w = Math.random()<koWinProb(p)?h:a; }
      const l = w===h?a:h;
      // feed into next slots
      for(const k2 of KFX){ if(k2[3]==="M"+no) slots[k2[0]][0]=w; if(k2[4]==="M"+no) slots[k2[0]][1]=w; if(k2[3]==="L"+no) slots[k2[0]][0]=l; if(k2[4]==="L"+no) slots[k2[0]][1]=l; }
      if(no>=89&&no<=96){ tally[w].qf=tally[w].qf; tally[h].r16++; tally[a].r16++; }
      if(no>=97&&no<=100){ tally[h].qf++; tally[a].qf++; }
      if(no===101||no===102){ tally[h].sf++; tally[a].sf++; }
      if(no===104){ tally[h].fin++; tally[a].fin++; tally[w].champ++; }
    }
  }
  for(const t in tally) for(const k in tally[t]) tally[t][k] = tally[t][k]/n*100;
  return tally;
}
function samplePlus(x){ const u=Math.random(); return u<0.55?0:u<0.85?1:2; }
function resolveSlotsSim(R,res){

function renderBracket(){
  const R = liveRatings();
  const slots = resolveSlots(R, true);
  const cols = [
    {t:"Round of 32",ms:KFX.filter(k=>k[0]<=88)},
    {t:"Round of 16",ms:KFX.filter(k=>k[0]>=89&&k[0]<=96)},
    {t:"Quarter-finals",ms:KFX.filter(k=>k[0]>=97&&k[0]<=100)},
    {t:"Semi-finals",ms:KFX.filter(k=>k[0]===101||k[0]===102)},
    {t:"Final",ms:KFX.filter(k=>k[0]>=103)}
  ];
  const winnerOf = no => {
    const r = state.results[no];
    const pair = slots[no];
    if(r && r.status==="FT" && r.h && r.a) return r.hs>r.as?r.h:r.hs<r.as?r.a:(r.pw||null);
    if(state.bracket[no] && pair && (state.bracket[no]===pair[0]||state.bracket[no]===pair[1])) return state.bracket[no];
    if(pair && pair[0] && pair[1]){ const k=KFX.find(x=>x[0]===no); const p=matchProbs(R,pair[0],pair[1],k[2],true); return koWinProb(p)>=0.5?pair[0]:pair[1]; }
    return null;
  };
  let html = "";
  for(const col of cols){
    html += `<div class="bcol"><h4>${col.t}</h4>`;
    for(const k of col.ms){
      const no=k[0], pair=slots[no]||[null,null], w=winnerOf(no);
      const r = state.results[no];
      const isUser = state.bracket[no] && !(r&&r.status==="FT");
      const isAI = !isUser && !(r&&r.status==="FT");
      const side=(t,sl)=>{
        const cls = (w&&t===w)?"bt w":"bt";
        const lbl = t?`${TF(t)} <span class="nm">${esc(t)}</span>`:`<span class="nm" style="color:var(--mut)">${esc(slotLabel(sl))}</span>`;
        const sc = (r&&r.status==="FT")? `<b>${t===((r.h)||pair[0])?r.hs:r.as}</b>`:"";
        return `<div class="${cls}" data-no="${no}" data-t="${esc(t||"")}">${lbl}${sc}</div>`;
      };
      html += `<div class="bm">${side(pair[0],k[3])}${side(pair[1],k[4])}
        <div class="meta">M${no} · ${fmtD(k[1])} · ${esc(k[2].replace(" Stadium",""))} ${r&&r.status==="FT"?"· FT":isUser?"· 🟠 your pick":w?"· ◆ AI":""}</div></div>`;
    }
    html += `</div>`;
  }
  $("#bracket").innerHTML = html;
  $("#bracket").querySelectorAll(".bt").forEach(el=>{
    el.onclick=()=>{
      const no=+el.dataset.no, t=el.dataset.t;
      if(!t) return;
      const r=state.results[no]; if(r&&r.status==="FT") return openTeam(t);
      state.bracket[no] = (state.bracket[no]===t)? undefined : t;
      if(state.bracket[no]===undefined) delete state.bracket[no];
      save(); renderBracket();
    };
  });
}
function slotLabel(sl){
  if(!sl) return "TBD";
  if(sl.startsWith("W1")) return "Winner Grp "+sl[2];
  if(sl.startsWith("R2")) return "Runner-up "+sl[2];
  if(sl.startsWith("T:")) return "3rd: "+sl.slice(2).split("").join("/");
  if(sl.startsWith("M")) return "Winner M"+sl.slice(1);
  if(sl.startsWith("L")) return "Loser M"+sl.slice(1);
  return sl;
}

function renderGame(){

      ${res.suggestion!==(state.news[t]||0)?`<button class="btn sm" id="applysug" style="margin-left:8px">Apply</button>`:""}</div>
      ${res.items.slice(0,6).map(it=>`<div class="row" style="font-size:.76rem"><a href="${esc(it.link)}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none;flex:1">${it.bad?"🔻":it.good?"🔺":"▪️"} ${esc(it.title)}</a></div>`).join("")}
      <div class="note">🔻 negative signal · 🔺 positive · auto-scored from injury/availability keywords. Review headlines before applying — you're smarter than keywords.</div>`;
      const ap = $("#applysug");
      if(ap) ap.onclick = () => { state.news[t] = res.suggestion; if(!state.news[t]) delete state.news[t]; save(); simCache=null; renderAll(); openTeam(t); toast("News adjustment applied"); };
    }
    if($("#scannews")){ $("#scannews").textContent = "🔎 Scan latest news"; $("#scannews").disabled = false; }
  };
}
function openSheet(html){ $("#sheet").innerHTML = html; $("#modal").classList.add("open"); }
function closeSheet(){ $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeSheet(); });

/* ================= LIVE DATA ================= */
async function fetchJSON(url, opts){
  try{ const r = await fetch(url, opts); if(!r.ok) throw 0; return await r.json(); }
  catch(e){
    try{ const r = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url)); if(!r.ok) throw 0; return await r.json(); }
    catch(e2){ return null; }
  }
}
async function fetchText(url){
  try{ const r = await fetch(url); if(!r.ok) throw 0; return await r.text(); }
  catch(e){
    try{ const r = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url)); if(!r.ok) throw 0; return await r.text(); }
    catch(e2){ return null; }
  }
}
const canon = n => { if(!n) return null; n=n.trim(); if(TEAMS[n]) return n; if(ALIASES[n]) return ALIASES[n]; for(const t in TEAMS) if(t.toLowerCase()===n.toLowerCase()) return t; return null; };
function findMatchNo(h,a,dateISO){
  for(const fx of GFX) if((fx[3]===h&&fx[4]===a)||(fx[3]===a&&fx[4]===h)) return {no:fx[0], flip:fx[3]!==h};
  for(const k of KFX){
    const r = state.results[k[0]];
    if(r && r.h && r.a && ((r.h===h&&r.a===a)||(r.h===a&&r.a===h))) return {no:k[0], flip:r.h!==h};
    if(dateISO && Math.abs(new Date(k[1])-new Date(dateISO))<3*36e5 && !(r&&r.h)){ /* KO not yet known here — only date-match if unique below */ }
  }
  if(dateISO){
    const cands = KFX.filter(k=>Math.abs(new Date(k[1])-new Date(dateISO))<90*60000 && !(state.results[k[0]]&&state.results[k[0]].h));
    if(cands.length===1) return {no:cands[0][0], flip:false, setTeams:true};
  }
  return null;
}
function mergeResult(no, nv, src){
  const ex = state.results[no];
  // manual FT entries only yield to an online FT; manual LIVE yields to any online data
  if(ex && ex.manual){
    if(ex.status==="FT" && nv.status!=="FT") return false;
  }
  // don't downgrade FT to LIVE
  if(ex && ex.status==="FT" && !ex.manual && nv.status==="LIVE") return false;
  if(!ex || ex.hs!==nv.hs || ex.as!==nv.as || ex.status!==nv.status || ex.min!==nv.min || (nv.h&&ex.h!==nv.h)){
    state.results[no] = {...ex, ...nv, manual:false};
    return true;
  }
  return false;
}
/* ESPN public scoreboard — no key, live minute-by-minute */
async function fetchESPN(){
  let updated = 0;
  const days = [new Date(Date.now()-864e5), new Date()].map(d=>d.toISOString().slice(0,10).replace(/-/g,""));
  for(const d of [...new Set(days)]){
    const data = await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates="+d);
    if(!data || !data.events) continue;
    for(const ev of data.events){
      const comp = (ev.competitions||[])[0]; if(!comp) continue;
      const home = comp.competitors.find(c=>c.homeAway==="home"), away = comp.competitors.find(c=>c.homeAway==="away");
      if(!home||!away) continue;
      const h = canon(home.team.displayName)||canon(home.team.shortDisplayName), a = canon(away.team.displayName)||canon(away.team.shortDisplayName);
      if(!h||!a) continue;
      const hit = findMatchNo(h,a,ev.date); if(!hit) continue;
      const st = ev.status&&ev.status.type?ev.status.type.state:"pre";
      const hs0 = +home.score||0, as0 = +away.score||0;
      const hs = hit.flip?as0:hs0, as = hit.flip?hs0:as0;
      const teams = hit.no>72 ? {h:hit.flip?a:h, a:hit.flip?h:a} : {};
      if(st==="in"){
        const min = (ev.status.displayClock||"").replace(/[^0-9+]/g,"");
        if(mergeResult(hit.no,{hs,as,status:"LIVE",min,...teams},"espn")) updated++;
      } else if(st==="post"){
        let pw;
        if(hs===as){ const w = comp.competitors.find(c=>c.winner); if(w){ const wn = canon(w.team.displayName); if(wn) pw = wn; } }
        if(mergeResult(hit.no,{hs,as,status:"FT",pw,...teams},"espn")) updated++;
      } else if(hit.no>72 && teams.h){
        if(mergeResult(hit.no,{status:"SCHED",...teams},"espn")) updated++;
      }
    }
  }
  return updated;
}
/* Google News RSS scan → suggested news adjustment for a team */
const NEG_WORDS = ["injur","ruled out","out of","doubt","suspend","ban","sidelin","blow","miss the","misses","strain","hamstring","fracture","surgery","illness","crisis","fitness concern","unavailable","withdraw"];
const POS_WORDS = ["returns","return to","fit again","boost","cleared","back in training","recovered","available again","full squad","passed fit","in form","unbeaten"];
async function scanNews(team){
  const xml = await fetchText("https://news.google.com/rss/search?q="+encodeURIComponent('"'+team+'" World Cup (injury OR squad OR lineup OR team news)')+"&hl=en-US&gl=US&ceid=US:en");
  if(!xml) return null;
  let doc; try{ doc = new DOMParser().parseFromString(xml,"text/xml"); }catch(e){ return null; }
  const items = [...doc.querySelectorAll("item")].slice(0,8).map(it=>({
    title: (it.querySelector("title")||{}).textContent||"",
    link: (it.querySelector("link")||{}).textContent||"",
    date: (it.querySelector("pubDate")||{}).textContent||""
  })).filter(x=>x.title);
  let score = 0;
  for(const it of items){
    const t = it.title.toLowerCase();
    for(const w of NEG_WORDS) if(t.includes(w)){ score -= 8; it.bad = true; break; }
    for(const w of POS_WORDS) if(t.includes(w) && !it.bad){ score += 6; it.good = true; break; }
  }
  return {items, suggestion: Math.max(-60, Math.min(40, score))};
}
async function refreshScores(manual){
  $("#refreshbtn").textContent = "…";
  let updated = 0;
  // Source 1: fixturedownload feed (full schedule, confirmed results, knockout team names)
  const feed = await fetchJSON("https://fixturedownload.com/feed/json/fifa-world-cup-2026");
  if(Array.isArray(feed)){
    for(const it of feed){
      const no = it.MatchNumber;
      const h = canon(it.HomeTeam), a = canon(it.AwayTeam);
      if(it.HomeTeamScore!=null && it.AwayTeamScore!=null){
        if(mergeResult(no,{hs:it.HomeTeamScore, as:it.AwayTeamScore, status:"FT", h:h||undefined, a:a||undefined},"feed")) updated++;
      } else if(no>72 && h && a){
        const ex = state.results[no]||{};
        if(ex.h!==h || ex.a!==a){ state.results[no]={...ex, h, a, status:ex.status||"SCHED"}; updated++; }
      }
    }
  }
  // Source 2: ESPN public scoreboard (no key — live minute-by-minute, today & yesterday)
  updated += await fetchESPN();
  // Source 3: football-data.org (optional key — live scores + penalty winners)
  if(state.fdKey){
    const fd = await fetchJSON("https://api.football-data.org/v4/competitions/WC/matches",{headers:{"X-Auth-Token":state.fdKey}});
    if(fd && fd.matches){
      for(const mm of fd.matches){
        const h = canon(mm.homeTeam && (mm.homeTeam.name||mm.homeTeam.shortName));
        const a = canon(mm.awayTeam && (mm.awayTeam.name||mm.awayTeam.shortName));
        if(!h||!a) continue;
        // find our match number by teams+date
        const all=[...GFX.map(x=>({no:x[0],d:x[1],h:x[3],a:x[4]})),...KFX.map(x=>({no:x[0],d:x[1]}))];
        const cand = all.find(x=> (x.h===h&&x.a===a) || (x.h===a&&x.a===h) || (x.no>72 && Math.abs(new Date(x.d)-new Date(mm.utcDate))<36e5 && state.results[x.no] && ((state.results[x.no].h===h&&state.results[x.no].a===a)||(state.results[x.no].h===a&&state.results[x.no].a===h))));
        if(!cand) continue;
        const sc = mm.score||{}; const ft = sc.fullTime||{};
        const flip = !(GFX.find(g=>g[0]===cand.no && g[3]===h)) && cand.no<=72;
        if(mm.status==="IN_PLAY"||mm.status==="PAUSED"){
          if(mergeResult(cand.no,{hs:flip?ft.away??0:ft.home??0, as:flip?ft.home??0:ft.away??0, status:"LIVE", min:mm.minute, h:cand.no>72?h:undefined, a:cand.no>72?a:undefined},"fd")) updated++;
        } else if(mm.status==="FINISHED" && ft.home!=null){
          const pw = sc.penalties && sc.penalties.home!=null ? (sc.penalties.home>sc.penalties.away?h:a) : undefined;
          if(mergeResult(cand.no,{hs:flip?ft.away:ft.home, as:flip?ft.home:ft.away, status:"FT", pw, h:cand.no>72?h:undefined, a:cand.no>72?a:undefined},"fd")) updated++;
        }
      }
    } else if(manual){ toast("football-data.org unreachable from browser — feed still active"); }
  }
  state.lastFetch = Date.now(); save();
  if(updated){ simCache=null; toast(updated+" match update"+(updated>1?"s":"")+" ⚡"); }
  else if(manual) toast("Up to date ✓");
  $("#refreshbtn").textContent = "⟳";
  $("#lastupd").textContent = "Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" · Jun 11 – Jul 19";
  renderAll();
}
function anyLiveWindow(){
  const now = Date.now();
  return [...GFX,...KFX].some(fx => { const t=new Date(fx[1]).getTime(); return now>t-10*60000 && now<t+140*60000; });
}
